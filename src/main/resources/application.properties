spring.application.name=cultivatech-platform
server.port=${PORT:8181}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.messages.basename=message
spring.messages.encoding=UTF-8

# JWT configuration. JWT_SECRET is mandatory, must contain at least 32 characters
# (256 bits) and must never be committed to source control.
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.minutes=${JWT_EXPIRATION_MINUTES:30}
authorization.jwt.issuer=cultivatech-platform
