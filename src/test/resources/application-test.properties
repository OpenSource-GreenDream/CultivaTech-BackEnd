spring.datasource.url=jdbc:h2:mem:cultivatech_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test-only signing key. Production keys must be supplied through JWT_SECRET.
authorization.jwt.issuer=cultivatech-platform
authorization.jwt.expiration.minutes=30
authorization.jwt.secret=test-only-jwt-secret-with-at-least-32-characters
